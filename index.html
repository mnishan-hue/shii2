<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B0B0C">
<title>For Shiyu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=DM+Sans:wght@300;400;500&family=Dancing+Script:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --black:#080808;
}
*{box-sizing:border-box}
html,body{
  margin:0;
  width:100%;
  min-height:100%;
  background:#080808;
}
html.locked,body.locked{overflow:hidden!important}
body{
  overflow:hidden;
  overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
#scene7Host{
  position:fixed;
  inset:0;
  z-index:30;
  display:block;
  opacity:1;
  visibility:visible;
  background:#0B0B0C;
  transition:opacity 2.2s ease,visibility 2.2s ease;
}
#scene7Host.fade-out{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}
#scene7Host.gone{display:none}

#scene8Host{
  position:relative;
  z-index:1;
  display:block;
  min-height:100vh;
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  transition:opacity 2.3s ease,visibility 2.3s ease;
}
#scene8Host.visible{
  opacity:1;
  visibility:visible;
  pointer-events:auto;
}
#finalHost{
  position:fixed;
  inset:0;
  z-index:50;
  display:block;
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  background:#050505;
  transition:opacity 2.4s ease,visibility 2.4s ease;
}
#finalHost.visible{
  opacity:1;
  visibility:visible;
  pointer-events:auto;
}

#letterDissolve{
  position:fixed;
  inset:0;
  z-index:45;
  pointer-events:none;
  opacity:0;
  visibility:hidden;
  transition:opacity .35s ease,visibility .35s ease;
}
#letterDissolve.active{
  opacity:1;
  visibility:visible;
}
#letterDissolve .warmVeil,
#letterDissolve .blackVeil{
  position:absolute;
  inset:0;
  opacity:0;
  will-change:opacity;
}
#letterDissolve .warmVeil{
  background:
    radial-gradient(72% 58% at 50% 42%,
      rgba(110,72,44,.28) 0%,
      rgba(62,42,30,.19) 38%,
      rgba(15,13,12,.34) 72%,
      rgba(8,8,8,.72) 100%);
  transition:opacity 2.6s cubic-bezier(.22,1,.36,1);
}
#letterDissolve.warming .warmVeil{
  opacity:1;
}
#letterDissolve .blackVeil{
  background:#050505;
  transition:opacity 2.35s cubic-bezier(.33,1,.68,1);
}
#letterDissolve.blackout .blackVeil{
  opacity:1;
}

/* the letter itself gently loses light instead of simply being covered */
#scene8Host.letter-fading{
  opacity:.12;
  transform:scale(.998);
  transition:
    opacity 2.7s ease,
    transform 3s cubic-bezier(.22,1,.36,1);
}

/* after the ending takes over, remove the letter from interaction/rendering */
#scene8Host.letter-gone{
  visibility:hidden;
  pointer-events:none;
}

@media(prefers-reduced-motion:reduce){
  #letterDissolve .warmVeil,
  #letterDissolve .blackVeil,
  #scene8Host.letter-fading{
    transition:none!important;
  }
}

@media(prefers-reduced-motion:reduce){
  #scene7Host,#scene8Host,#finalHost{transition:none!important}
}

/* Scene 4 → Scene 5/6 → Scene 7 orchestration */
#scene4Host,#scene56Host,#scene7Host{
  position:fixed;
  inset:0;
  display:block;
  transition:opacity 2.2s ease,visibility 2.2s ease,filter 2.2s ease;
}
#scene4Host{
  z-index:40;
  opacity:1;
  visibility:visible;
  background:#0B0A09;
}
#scene4Host.fade-out{opacity:0;visibility:hidden;pointer-events:none}
#scene4Host.gone{display:none}
#scene56Host{
  z-index:35;
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  background:#0F1114;
}
#scene56Host.visible{opacity:1;visibility:visible;pointer-events:auto}
#scene56Host.fade-out{opacity:0;visibility:hidden;pointer-events:none}
#scene56Host.gone{display:none}
/* Scene 7 is underneath until Scene 6 is finished. */
#scene7Host{
  z-index:30;
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}
#scene7Host.visible{opacity:1;visibility:visible;pointer-events:auto}
#scene7Host.fade-out{opacity:0;visibility:hidden;pointer-events:none}
#scene7Host.gone{display:none}

#scene45Veil{
  position:fixed;
  inset:0;
  z-index:44;
  pointer-events:none;
  background:#070707;
  opacity:0;
  visibility:hidden;
  transition:opacity 1.8s cubic-bezier(.22,1,.36,1),visibility 1.8s ease;
}
#scene45Veil.show{opacity:1;visibility:visible}

@media(prefers-reduced-motion:reduce){
  #scene4Host,#scene56Host,#scene7Host,#scene45Veil{transition:none!important}
}


/* Scene 1 → 3 → Scene 4 production orchestration */
#scene123Host{
  position:fixed;
  inset:0;
  z-index:60;
  display:block;
  opacity:1;
  visibility:visible;
  pointer-events:auto;
  background:#0B0A09;
  transition:opacity 2.1s ease,visibility 2.1s ease,filter 2.1s ease;
}
#scene123Host.fade-out{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
  filter:none;
}
#scene123Host.gone{display:none}

/* Scene 4 stays completely dormant until Wallahi has finished. */
#scene4Host{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}
#scene4Host.visible{
  opacity:1;
  visibility:visible;
  pointer-events:auto;
}
#scene4Host.visible.fade-out{
  opacity:0;
  visibility:hidden;
  pointer-events:none;
}

#scene34Veil{
  position:fixed;
  inset:0;
  z-index:64;
  pointer-events:none;
  background:#080808;
  opacity:0;
  visibility:hidden;
  transition:opacity 1.75s cubic-bezier(.22,1,.36,1),visibility 1.75s ease;
}
#scene34Veil.show{
  opacity:1;
  visibility:visible;
}

@media(prefers-reduced-motion:reduce){
  #scene123Host,#scene4Host,#scene34Veil{transition:none!important}
}


#scene123Host,#scene56Host,#scene7Host,#finalHost{
  -webkit-tap-highlight-color:transparent;
}
#scene123Host,#scene56Host,#scene7Host,#finalHost{
  user-select:none;
  -webkit-user-select:none;
}
#scene4Host,#scene8Host{
  user-select:text;
  -webkit-user-select:text;
}


/* performance safeguards: scenes are lazy-mounted and crossfades use opacity only */
@media(max-width:600px){
  #scene123Host,#scene4Host,#scene56Host,#scene7Host,#scene8Host,#finalHost{will-change:opacity}
}

@media(max-height:650px) and (max-width:600px){
  #scene123Host,#scene4Host,#scene56Host,#scene7Host,#finalHost{
    font-size:95%;
  }
}

/* V3 cinematic controls: intentionally quiet until the viewer interacts. */
#cinemaControls{
  position:fixed;
  z-index:100;
  right:max(18px,env(safe-area-inset-right));
  bottom:max(18px,env(safe-area-inset-bottom));
  display:flex;
  align-items:center;
  gap:7px;
  padding:6px;
  border:1px solid rgba(255,255,255,.10);
  border-radius:999px;
  background:rgba(9,9,10,.46);
  box-shadow:0 10px 30px rgba(0,0,0,.18);
  -webkit-backdrop-filter:blur(14px);
  backdrop-filter:blur(14px);
  opacity:0;
  transform:translateY(8px);
  pointer-events:none;
  transition:opacity .45s ease,transform .45s cubic-bezier(.22,1,.36,1);
}
#cinemaControls.visible{
  opacity:1;
  transform:translateY(0);
  pointer-events:auto;
}
#cinemaControls button{
  width:38px;
  height:38px;
  display:grid;
  place-items:center;
  border:0;
  border-radius:50%;
  color:rgba(249,242,233,.88);
  background:transparent;
  font:500 13px/1 "DM Sans",system-ui,sans-serif;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition:background .25s ease,color .25s ease,transform .25s ease;
}
#cinemaControls button:hover,
#cinemaControls button:focus-visible{
  color:#D6B16A;
  background:rgba(255,255,255,.09);
  outline:none;
}
#cinemaControls button:active{transform:scale(.92)}
#cinemaControls .control-state{
  width:auto;
  min-width:62px;
  padding:0 12px;
  border-radius:999px;
  font-size:11px;
  letter-spacing:.08em;
  text-transform:uppercase;
}
#cinemaControls .control-divider{
  width:1px;
  height:18px;
  background:rgba(255,255,255,.12);
}
@media(max-width:600px){
  #cinemaControls{
    right:max(12px,env(safe-area-inset-right));
    bottom:max(12px,env(safe-area-inset-bottom));
  }
  #cinemaControls button{width:36px;height:36px}
  #cinemaControls .control-state{min-width:58px;padding:0 10px}
}
@media(prefers-reduced-motion:reduce){
  #cinemaControls{transition:none!important}
}
</style>
</head>
<body data-runthrough="full-experience">
<div id="scene123Host"></div>
<div id="scene34Veil" aria-hidden="true"></div>
<div id="scene4Host"></div>
<div id="scene56Host"></div>
<div id="scene45Veil" aria-hidden="true"></div>
<div id="scene7Host"></div>
<div id="scene8Host"></div>
<div id="letterDissolve" aria-hidden="true">
  <div class="warmVeil"></div>
  <div class="blackVeil"></div>
</div>
<div id="finalHost"></div>
<div id="cinemaControls" aria-label="Experience controls">
  <button class="control-state" id="cinemaPause" type="button" aria-label="Pause experience">Pause</button>
  <span class="control-divider" aria-hidden="true"></span>
  <button id="cinemaRestart" type="button" aria-label="Restart experience" title="Restart">↻</button>
</div>
<script>
(() => {
  const TEST = new URLSearchParams(location.search).has('test');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const factor = TEST ? 0.025 : 1;
  const scaledDelay = ms => reduced
    ? Math.min(100, Math.max(20, ms*0.025))
    : ms*factor;
  let userPaused = false;

  // Production wait: timers pause while the tab/app is hidden.
  // This prevents several scenes from "catching up" at once when she returns.
  const wait = ms => new Promise(resolve => {
    let remaining = scaledDelay(ms);
    if(remaining <= 0){ resolve(); return; }

    let startedAt = 0;
    let timer = null;
    let finished = false;

    const cleanup = () => {
      document.removeEventListener('visibilitychange', onVisibility);
      document.removeEventListener('cinema-pause', onCinemaPause);
    };

    const finish = () => {
      if(finished) return;
      finished = true;
      if(timer) clearTimeout(timer);
      cleanup();
      resolve();
    };

    const start = () => {
      if(finished || document.hidden || userPaused) return;
      startedAt = performance.now();
      timer = setTimeout(finish, remaining);
    };

    const onCinemaPause = () => {
      if(finished) return;
      if(userPaused){
        if(timer){
          clearTimeout(timer);
          timer = null;
          remaining = Math.max(0, remaining - (performance.now() - startedAt));
        }
      }else if(remaining <= 0){
        finish();
      }else{
        start();
      }
    };

    const onVisibility = () => {
      if(finished) return;
      if(document.hidden){
        if(timer){
          clearTimeout(timer);
          timer = null;
          remaining = Math.max(0, remaining - (performance.now() - startedAt));
        }
      }else{
        if(remaining <= 0) finish();
        else start();
      }
    };

    document.addEventListener('visibilitychange', onVisibility);
    document.addEventListener('cinema-pause', onCinemaPause);
    start();
  });

  const host123 = document.getElementById('scene123Host');
  const veil34 = document.getElementById('scene34Veil');
  const host4 = document.getElementById('scene4Host');
  const host56 = document.getElementById('scene56Host');
  const host7 = document.getElementById('scene7Host');
  const host8 = document.getElementById('scene8Host');
  const hostF = document.getElementById('finalHost');
  const veil45 = document.getElementById('scene45Veil');
  const dissolve = document.getElementById('letterDissolve');

  const root123 = host123.attachShadow({mode:'open'});
  const root4 = host4.attachShadow({mode:'open'});
  const root56 = host56.attachShadow({mode:'open'});
  const root7 = host7.attachShadow({mode:'open'});
  const root8 = host8.attachShadow({mode:'open'});
  const rootF = hostF.attachShadow({mode:'open'});

  const shadowPolishCss = `
    :host{-webkit-tap-highlight-color:transparent}
    @media(max-width:400px){
      .stage{padding-left:18px!important;padding-right:18px!important}
      .s1-hello{
        width:92vw!important;
        max-width:360px;
        white-space:normal!important;
        font-size:clamp(38px,12vw,56px)!important;
        line-height:1.08;
      }
      .line{width:90vw!important;max-width:360px}
      .s3-written{width:90vw!important}
      .s3-card{width:84vw!important}
      .letter-scroll{padding-left:40px!important;padding-right:18px!important}
      .paper-wrap{padding-left:8px!important;padding-right:8px!important}
      .para{font-size:clamp(19px,5.3vw,22px)!important}
      .photo{border-radius:16px!important}
      .track{padding-left:5vw!important;padding-right:5vw!important}
    }
    .placeholder img{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      display:block;
      object-fit:cover;
    }
    .s3-card img,.s3-card video{
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      display:block;
      object-fit:cover;
      background:#121110;
    }
    @media(min-width:900px){
      .stage{padding-left:28px;padding-right:28px}
      .line{max-width:680px}
      .s3-card{max-height:76vh}
      .letter-scroll{padding-left:92px;padding-right:48px}
    }
    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{scroll-behavior:auto!important}
    }
  `;
  const polishRoot = root => {
    if(!root || root.querySelector('style[data-v3-polish]')) return;
    const style = document.createElement('style');
    style.dataset.v3Polish = '1';
    style.textContent = shadowPolishCss;
    root.appendChild(style);
  };

  /*
    Drop media into these paths later and the experience will pick it up
    without editing the long scene payloads below.
  */
  const mediaConfig = {
    photos: [
      'assets/photos/moment-01.webp',
      'assets/photos/moment-02.webp',
      'assets/photos/moment-03.webp',
      'assets/photos/moment-04.webp',
      'assets/photos/moment-05.webp',
      'assets/photos/moment-06.webp',
      'assets/photos/moment-07.webp'
    ],
    awardVideo: 'assets/memories/award-video.mp4',
    awardPoster: 'assets/memories/award-poster.webp'
  };

  const wireMediaSlots = root => {
    if(!root || root.querySelector('[data-v3-media-wired]')) return;
    const slotMarker = document.createElement('span');
    slotMarker.dataset.v3MediaWired = '1';
    slotMarker.hidden = true;
    root.appendChild(slotMarker);

    [...root.querySelectorAll('.placeholder')].forEach((slot,index) => {
      const src = mediaConfig.photos[index];
      if(!src) return;
      const img = new Image();
      img.alt = `Memory ${String(index+1).padStart(2,'0')}`;
      img.loading = index < 2 ? 'eager' : 'lazy';
      img.decoding = 'async';
      img.src = src;
      img.addEventListener('load', () => {
        slot.replaceChildren(img);
        slot.classList.add('has-media');
      }, {once:true});
    });

    const memoryCard = root.getElementById('s3_card');
    if(!memoryCard || !mediaConfig.awardVideo) return;
    const video = document.createElement('video');
    video.src = mediaConfig.awardVideo;
    video.muted = true;
    video.playsInline = true;
    video.preload = 'metadata';
    if(mediaConfig.awardPoster) video.poster = mediaConfig.awardPoster;
    video.setAttribute('aria-label','Memory video');
    video.style.display = 'none';
    video.addEventListener('loadeddata', () => { video.style.display = 'block'; }, {once:true});
    video.addEventListener('error', () => video.remove(), {once:true});
    memoryCard.appendChild(video);

    const memory = root.getElementById('s3_memory');
    if(memory){
      const observer = new MutationObserver(() => {
        if(memory.classList.contains('show')){
          video.currentTime = 0;
          video.play().catch(() => {});
        }else{
          video.pause();
        }
      });
      observer.observe(memory,{attributes:true,attributeFilter:['class']});
    }
  };

  const payload123 = "<style>\n:host{\n  --ink:#2A2520;\n  --muted:#776960;\n  --cream:#F6EEE5;\n  --warm:#F5E8D7;\n  --paper:#F3E4D1;\n  --gold:#BE9140;\n  --gold-soft:#D6B16A;\n  --black:#0B0A09;\n  --ease:cubic-bezier(.22,1,.36,1);\n}\n*{box-sizing:border-box}\nhtml,body{\n  margin:0;\n  width:100%;\n  height:100%;\n  overflow:hidden;\n  background:var(--black);\n}\nbody{\n  font-family:\"DM Sans\",system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",sans-serif;\n  -webkit-font-smoothing:antialiased;\n  text-rendering:optimizeLegibility;\n  color:var(--ink);\n}\n.experience{\n  position:relative;\n  width:100%;\n  height:100svh;\n  height:100dvh;\n  overflow:hidden;\n  background:var(--black);\n}\n.scene{\n  position:absolute;\n  inset:0;\n  opacity:0;\n  visibility:hidden;\n  pointer-events:none;\n  overflow:hidden;\n  transition:opacity 1.4s ease, visibility 0s linear 1.4s;\n}\n.scene.active{\n  opacity:1;\n  visibility:visible;\n  pointer-events:auto;\n  transition:opacity 1.4s ease, visibility 0s linear 0s;\n}\n.scene::before{\n  content:\"\";\n  position:absolute;\n  inset:0;\n  z-index:0;\n  pointer-events:none;\n  opacity:.08;\n  background-image:\n    radial-gradient(circle at 20% 25%, rgba(255,255,255,.20) 0 1px, transparent 1.5px),\n    radial-gradient(circle at 70% 70%, rgba(255,255,255,.18) 0 1px, transparent 1.6px),\n    radial-gradient(circle at 60% 35%, rgba(255,255,255,.14) 0 1px, transparent 1.5px);\n  background-size:180px 180px, 220px 220px, 260px 260px;\n  mix-blend-mode:soft-light;\n}\n.bg{\n  position:absolute;\n  inset:-10%;\n  z-index:0;\n  pointer-events:none;\n}\n.bg::before,.bg::after{\n  content:\"\";\n  position:absolute;\n  border-radius:50%;\n  filter:none;\n}\n\n.scene1 .bg{\n  background:\n    radial-gradient(52% 40% at 20% 18%, rgba(255,255,255,.54), transparent 72%),\n    radial-gradient(38% 32% at 82% 78%, rgba(218,165,92,.16), transparent 74%),\n    linear-gradient(145deg, #F9F4EE 0%, #F5EBDD 52%, #F0DFC9 100%);\n}\n.scene1 .bg::before{\n  width:58vw;height:58vw;max-width:420px;max-height:420px;\n  left:-8vw;top:8vh;\n  background:radial-gradient(circle, rgba(255,255,255,.26), rgba(255,255,255,.02) 62%, transparent 76%);\n  animation:floatA 18s ease-in-out infinite alternate;\n}\n.scene1 .bg::after{\n  width:52vw;height:52vw;max-width:360px;max-height:360px;\n  right:-8vw;bottom:10vh;\n  background:radial-gradient(circle, rgba(214,177,106,.18), rgba(214,177,106,.04) 58%, transparent 74%);\n  animation:floatB 15s ease-in-out infinite alternate;\n}\n\n.scene2 .bg{\n  background:\n    radial-gradient(50% 42% at 18% 20%, rgba(255,255,255,.42), transparent 74%),\n    radial-gradient(40% 32% at 84% 72%, rgba(214,177,106,.16), transparent 74%),\n    linear-gradient(145deg, #F7EFE7 0%, #F1E2D2 54%, #E9D1BA 100%);\n}\n.scene2 .bg::before{\n  width:50vw;height:50vw;max-width:360px;max-height:360px;\n  right:-8vw;top:10vh;\n  background:radial-gradient(circle, rgba(214,177,106,.16), rgba(214,177,106,.03) 60%, transparent 74%);\n  animation:floatC 16s ease-in-out infinite alternate;\n}\n.scene2 .bg::after{\n  width:46vw;height:46vw;max-width:330px;max-height:330px;\n  left:-8vw;bottom:12vh;\n  background:radial-gradient(circle, rgba(255,255,255,.22), rgba(255,255,255,.03) 60%, transparent 74%);\n  animation:floatD 17s ease-in-out infinite alternate;\n}\n\n.scene3 .bg{\n  background:\n    radial-gradient(44% 36% at 24% 18%, rgba(255,255,255,.18), transparent 75%),\n    radial-gradient(36% 30% at 82% 78%, rgba(214,177,106,.10), transparent 76%),\n    linear-gradient(145deg, #F3E4D1 0%, #E9D4BE 60%, #E0C2A5 100%);\n  transition:opacity 1.2s ease, background 1.2s ease;\n}\n.scene3 .bg::before{\n  width:54vw;height:54vw;max-width:400px;max-height:400px;\n  left:-10vw;top:14vh;\n  background:radial-gradient(circle, rgba(214,177,106,.16), rgba(214,177,106,.03) 60%, transparent 74%);\n  animation:floatE 18s ease-in-out infinite alternate;\n}\n.scene3 .bg::after{\n  width:44vw;height:44vw;max-width:300px; w{opacity:1}\n.s2-main{\n  margin:0;font-family:\"Cormorant Garamond\",Georgia,serif;font-size:clamp(38px,10vw,52px);\n  line-height:1.15;font-style:italic;\n}\n.s2-sub{\n  margin:18px 0 0;font-size:16px;line-height:1.7;font-weight:300;color:var(--muted);\n  opacity:0;transform:translateY(6px);transition:opacity .8s ease, transform .8s var(--ease);\n}\n.s2-sub.show{opacity:1;transform:translateY(0)}\n.s2-note{margin-top:16px;display:flex;align-items:center;gap:2px;opacity:0;transition:opacity 1s ease}\n.s2-note.show{opacity:1}\n.s2-note-text{\n  font-family:\"Dancing Script\",\"Segoe Script\",cursive;font-size:21px;font-weight:600;color:var(--gold-soft);\n}\n.s2-bridge{\n  position:absolute;inset:0;z-index:4;display:grid;place-items:center;opacity:0;pointer-events:none;\n  transition:opacity .9s ease;\n}\n.s2-bridge.show{opacity:1}\n.s2-bridge-line{\n  width:34px;height:1px;background:rgba(214,177,106,.94);\n  box-shadow:0 0 12px rgba(214,177,106,.18), 0 0 24px rgba(214,177,106,.10);\n  transform-origin:center center;transition:width 1.6s var(--ease), opacity .7s ease, transform 1.2s var(--ease);\n}\n.s2-bridge-point{\n  position:absolute;width:8px;height:8px;border-radius:50%;background:var(--gold-soft);\n  box-shadow:0 0 16px rgba(214,177,106,.38), 0 0 34px rgba(214,177,106,.18);\n  opacity:0;transform:scale(.35);transition:opacity .7s ease, transform .8s var(--ease);\n}\n.s2-bridge.expand .s2-bridge-line{width:min(58vw,240px)}\n.s2-bridge.expand .s2-bridge-point{opacity:.95;transform:scale(1)}\n.s2-bridge.contract .s2-bridge-line{width:0;opacity:0;transform:scaleX(.2)}\n.s2-bridge.contract .s2-bridge-point{opacity:0;transform:scale(.2)}\n.blackout{\n  position:absolute;inset:0;background:var(--black);opacity:0;transition:opacity 1.2s ease;\n  pointer-events:none;z-index:5;\n}\n.blackout.show{opacity:1}\n.blackout.dim{opacity:.55}\n\n/* Scene 3 */\n.s3-halo{\n  position:absolute;left:50%;top:50%;width:min(68vw,340px);aspect-ratio:1/1;transform:translate(-50%,-50%);\n  border-radius:50%;background:radial-gradient(circle, rgba(214,177,106,.15) 0%, rgba(214,177,106,.06) 34%, transparent 70%);\n  filter:blur(26px);opacity:0;transition:opacity 1.3s ease;z-index:1;\n}\n.scene3.dark .s3-halo{opacity:.84;animation:haloPulse 8s ease-in-out infinite alternate}\n.s3-written{\n  position:absolute;left:50%;top:50%;width:min(84vw,430px);transform:translate(-50%,-50%);\n  display:flex;justify-content:center;align-items:center;gap:2px;opacity:0;filter:blur(2px);\n  transition:opacity 1.1s ease, filter 1.1s ease;z-index:4;text-align:center;\n}\n.s3-written.show{opacity:1;filter:blur(0)}\n.s3-written-text{\n  font-family:\"Dancing Script\",\"Segoe Script\",cursive;font-size:clamp(36px,9.4vw,50px);\n  line-height:1.3;font-weight:600;color:var(--cream);transition:color .7s ease, text-shadow .7s ease, transform .6s var(--ease);\n}\n.s3-written-text.gold{\n  color:var(--gold-soft);text-shadow:0 1px 20px rgba(214,177,106,.18), 0 0 20px rgba(214,177,106,.10);\n}\n.s3-written-text.lift{transform:scale(1.014)}\n.s3-written-text.final{\n  color:var(--gold);font-size:clamp(41px,10.4vw,57px);\n  text-shadow:0 1px 22px rgba(214,177,106,.20), 0 0 22px rgba(214,177,106,.10);\n}\n\n.s3-memory{\n  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;\n  opacity:0;transition:opacity 1.25s ease;z-index:4;\n}\n.s3-memory.show{opacity:1}\n.s3-card{\n  width:min(92vw,470px);aspect-ratio:9/16;max-height:74vh;border-radius:16px;overflow:hidden;background:#121110;\n  border:1px solid rgba(255,255,255,.08);box-shadow:0 24px 56px rgba(0,0,0,.28), 0 0 18px rgba(214,177,106,.06);\n  transform:scale(.985);opacity:0;transition:transform 1.4s var(--ease), opacity 1.4s ease;position:relative;\n}\n.s3-card.show{transform:scale(1);opacity:1}\n.s3-card-placeholder{\n  position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:rgba(246,238,229,.84);\n  font-family:\"Cormorant Garamond\",Georgia,serif;font-size:clamp(28px,7vw,34px);line-height:1.36;\n  background:radial-gradient(50% 34% at 50% 35%, rgba(255,255,255,.06), transparent 70%), linear-gradient(180deg, #121110 0%, #0E0D0C 100%);\n}\n.s3-caption{margin-top:16px;font-family:\"Dancing Script\",\"Segoe Script\",cursive;font-size:18px;color:rgba(246,238,229,.72)}\n\n.s3-windowlight{\n  position:absolute;left:-120%;top:0;height:100%;width:55%;\n  background:linear-gradient(90deg, transparent 0%, rgba(255,255,255,.025) 35%, rgba(214,177,106,.06) 50%, rgba(255,255,255,.025) 65%, transparent 100%);\n  opacity:0;filter:blur(2px);pointer-events:none;z-index:2;\n}\n.s3-windowlight.show{\n  opacity:1;\n  animation:busSweep 7s linear 1;\n}\n\n@media (min-width:900px){\n  .stage{width:min(72vw,700px)}\n  .line{width:min(60vw,620px)}\n  .bodycopy{font-size:21px}\n  .s3-card{width:min(32vw,430px)}\n  .s3-written{width:min(56vw,600px)}\n}\n@media (prefers-reduced-motion:reduce){\n  *,*::before,*::after{animation:none!important;transition:none!important;filter:none!important}\n  .cursor,.write-cursor{display:none}\n}\n\\n:host{display:block;width:100%;height:100%;overflow:hidden;background:#0B0A09;color:#2A2520;font-family:\"DM Sans\",system-ui,-apple-system,BlinkMacSystemFont,\"Segoe UI\",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}\\n.experience{height:100%;min-height:100%;}\\n\n@media(max-width:600px){\n  .bg::before,.bg::after{animation:none!important}\n  .line{filter:none!important}\n  .scene::before{mix-blend-mode:normal;opacity:.045}\n}\n</style><main class=\"experience\">\n\n  <!-- Scene 1 -->\n  <section class=\"scene scene1 active\" id=\"scene1\">\n    <div class=\"bg\"></div>\n    <div class=\"stage\">\n      <div class=\"s1-hello\" id=\"s1_hello\">\n        <span id=\"s1_type\"></span><span class=\"cursor\" id=\"s1_cursor\"></span>\n      </div>\n\n      <p class=\"line bodycopy\" id=\"s1_l1\">I know life hasn’t exactly been the nicest to you lately.</p>\n      <p class=\"line bodycopy\" id=\"s1_l2\">And I know you don’t really want to explain everything right now.</p>\n      <p class=\"line serif strong gold\" id=\"s1_l3\">So I’m not going to ask you to.</p>\n      <p class=\"line bodycopy\" id=\"s1_l4\">I just wanted to make you something small.</p>\n      <p class=\"line bodycopy\" id=\"s1_l5\">Something you can sit with for a few minutes.</p>\n      <p class=\"line serif strong gold\" id=\"s1_l6\">No questions.<br>No pressure.</p>\n\n      <div class=\"s1-final\" id=\"s1_final\">\n        <div class=\"hairline\"></div>\n        <p class=\"s1-final-text gold\" id=\"s1_finalText\">Just for you.</p>\n        <div class=\"s1-note\">take your time.</div>\n      </div>\n    </div>\n  </section>\n\n  <!-- Scene 2 -->\n  <section class=\"scene scene2\" id=\"scene2\">\n    <div class=\"bg\"></div>\n    <div class=\"s2-carry\" id=\"s2_carry\">take your time.</div>\n\n    <div class=\"stage\">\n      <p class=\"line hand gold\" id=\"s2_l1\">and before anything else…</p>\n      <p class=\"line serif\" id=\"s2_l2\">there’s something I want you to remember.</p>\n      <p class=\"line bodycopy\" id=\"s2_l3\">You spend so much time trying to handle things yourself.</p>\n      <p class=\"line bodycopy\" id=\"s2_l4\">Trying to figure things out.</p>\n      <p class=\"line bodycopy\" id=\"s2_l5\">Trying to keep moving even when you probably don’t feel like it.</p>\n\n      <p class=\"line serif strong gold\" id=\"s2_l6\">You don’t have to be impressive with me.</p>\n      <p class=\"line serif strong gold\" id=\"s2_l7\">You can just be tired.</p>\n\n      <div class=\"s2-words\" id=\"s2_words\">\n        <span class=\"s2-word w1\">strong</span>\n        <span class=\"s2-word w2\">productive</span>\n        <span class=\"s2-word w3\">replying</span>\n        <span class=\"s2-word w4\">smiling</span>\n        <span class=\"s2-word w5\">energetic</span>\n        <span class=\"s2-word w6\">okay</span>\n        <span class=\"s2-word w7\">figuring everything out</span>\n      </div>\n\n      <p class=\"s2-thought serif gold\" id=\"s2_thought\">You don’t have to be all of these every day.</p>\n\n      <p class=\"line bodycopy\" id=\"s2_l8\">You don’t have to explain why you’re quiet.</p>\n      <p class=\"line bodycopy\" id=\"s2_l9\">You don’t have to make everyone comfortable by pretending you’re okay.</p>\n      <p class=\"line bodycopy\" id=\"s2_l10\">You don’t have to have an answer for everything.</p>\n\n      <div class=\"s2-final\" id=\"s2_final\">\n        <p class=\"s2-main gold\" id=\"s2_main\">You can just be Shiya.</p>\n        <div class=\"hairline\" id=\"s2_hairline\" style=\"opacity:0; transition:opacity .8s ease, transform .8s var(--ease); transform:scaleX(.35);\"></div>\n        <p class=\"s2-sub\" id=\"s2_fs1\">even if today’s Shiya is quiet.</p>\n        <p class=\"s2-sub\" id=\"s2_fs2\">even if she’s tired.</p>\n        <p class=\"s2-sub\" id=\"s2_fs3\">even if she doesn’t feel like talking.</p>\n        <div class=\"s2-note\" id=\"s2_note\">\n          <span class=\"s2-note-text\" id=\"s2_noteText\"></span><span class=\"write-cursor\" id=\"s2_noteCursor\"></span>\n        </div>\n      </div>\n\n      <div class=\"s2-bridge\" id=\"s2_bridge\">\n        <div class=\"s2-bridge-line\"></div>\n        <div class=\"s2-bridge-point\"></div>\n      </div>\n      <div class=\"blackout\" id=\"s2_blackout\"></div>\n    </div>\n  </section>\n\n  <!-- Scene 3 -->\n  <section class=\"scene scene3\" id=\"scene3\">\n    <div class=\"bg\"></div>\n    <div class=\"s3-windowlight\" id=\"s3_windowlight\"></div>\n    <div class=\"s3-halo\"></div>\n    <div class=\"stage\">\n      <p class=\"line serif strong gold\" id=\"s3_l1\">Bud! I would like to take a moment and remind you how inspiring you are.</p>\n      <p class=\"line serif\" id=\"s3_l2\">Not just because you do well.<br>But because of the kind of person you are while doing it.</p>\n      <p class=\"line serif gold\" id=\"s3_l3\">If I had to point out one moment…</p>\n      <p class=\"line serif gold\" id=\"s3_l4\">it would be this.</p>\n\n      <div class=\"s3-written\" id=\"s3_w0\">\n        <span class=\"s3-written-text gold\" id=\"s3_w0text\"></span><span class=\"write-cursor\" id=\"s3_w0cursor\"></span>\n      </div>\n\n      <div class=\"s3-memory\" id=\"s3_memory\">\n        <div class=\"s3-card\" id=\"s3_card\">\n          <div class=\"s3-card-placeholder\">your 10th-standard<br>award video goes here</div>\n        </div>\n        <div class=\"s3-caption\">let this one breathe.</div>\n      </div>\n\n      <p class=\"line bodycopy\" id=\"s3_l6\">I still remember my dad telling me your mom’s eyes were watering with happiness that day.</p>\n      <p class=\"line bodycopy\" id=\"s3_l7\">And honestly, just thinking about that makes my heart so full.</p>\n      <p class=\"line serif gold\" id=\"s3_l8\">Because imagine how proud they must have felt, Shiyu.</p>\n      <p class=\"line serif gold\" id=\"s3_l9\">Not just proud of your marks — proud of you.</p>\n      <p class=\"line bodycopy\" id=\"s3_l10\">I still remember my mom telling me, “Learn something from Shiyu and make me proud too.”</p>\n      <p class=\"line serif gold\" id=\"s3_l11\">That’s the thing… you’ve been inspiring people without even knowing it.</p>\n\n      <p class=\"line bodycopy gold\" id=\"s3_l12\">And then there’s this other moment I still think about sometimes.</p>\n      <p class=\"line serif\" id=\"s3_l13\">A very simple one.</p>\n      <p class=\"line serif\" id=\"s3_l14\">But it stayed with me.</p>\n      <p class=\"line serif gold\" id=\"s3_l15\">That day in the bus…</p>\n      <p class=\"line bodycopy\" id=\"s3_l16\">you were telling me so casually about how happily your dad was speaking to his friend about that scholarship you got to study abroad.</p>\n      <p class=\"line bodycopy\" id=\"s3_l17\">And while you were saying it so normally…</p>\n\n      <div class=\"s3-written\" id=\"s3_w1\">\n        <span class=\"s3-written-text gold\" id=\"s3_w1text\"></span><span class=\"write-cursor\" id=\"s3_w1cursor\"></span>\n      </div>\n\n      <p class=\"line serif gold\" id=\"s3_l18\">That quiet, full-hearted kind of pride only a parent feels.</p>\n      <p class=\"line serif\" id=\"s3_l19\">The kind that doesn’t need a big speech.</p>\n      <p class=\"line serif gold\" id=\"s3_l20\">The kind that simply says — look at my daughter.</p>\n      <p class=\"line bodycopy\" id=\"s3_l21\">And sitting there listening to you…</p>\n      <p class=\"line serif gold\" id=\"s3_l22\">I was genuinely so proud of you too.</p>\n      <p class=\"line serif\" id=\"s3_l23\">Not just because you achieved something big.</p>\n      <p class=\"line serif gold\" id=\"s3_l24\">But because of how beautifully you make your parents proud.</p>\n\n      <p class=\"line bodycopy\" id=\"s3_l25\">Sometimes I really don’t think you realise how many moments you give people…</p>\n      <p class=\"line bodycopy\" id=\"s3_l26\">where they get to stop, smile, and think—</p>\n\n      <div class=\"s3-written\" id=\"s3_w2\">\n        <span class=\"s3-written-text gold\" id=\"s3_w2text\"></span><span class=\"write-cursor\" id=\"s3_w2cursor\"></span>\n      </div>\n\n      <p class=\"line serif\" id=\"s3_l27\">And honestly…</p>\n      <p class=\"line serif gold\" id=\"s3_l28\">I’m always proud of you.</p>\n      <p class=\"line bodycopy gold\" id=\"s3_l29\">Thank you for inspiring me.</p>\n      <p class=\"line bodycopy\" id=\"s3_l30\">And thank you for inspiring more people than you probably realise.</p>\n      <p class=\"line serif gold\" id=\"s3_l31\">You really are a blessing, Shiyu.</p>\n      <p class=\"line bodycopy gold\" id=\"s3_l32\">And your parents are truly blessed to have you.</p>\n\n      <div class=\"s3-written\" id=\"s3_w3\">\n        <span class=\"s3-written-text final\" id=\"s3_w3text\"></span><span class=\"write-cursor\" id=\"s3_w3cursor\"></span>\n      </div>\n    </div>\n    <div class=\"blackout\" id=\"s3_blackout\"></div>\n  </section>\n</main>";

  const payload4 = "<style>\n:host{--ink:#2A2520;--muted:#74675F;--paper:#F7F0E7;--gold:#B88A34;--gold-soft:#CFA85B;--black:#0B0A09;--ease:cubic-bezier(.22,1,.36,1)}\n*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--black);overflow:hidden}\nbody{font-family:\"DM Sans\",system-ui,sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}\n.scene{position:relative;width:100%;height:100svh;height:100dvh;overflow:hidden;background:var(--black)}\n.blackhold{position:absolute;inset:0;z-index:10;background:var(--black);opacity:1;pointer-events:none;transition:opacity 1.8s ease}\n.blackhold.hide{opacity:0}\n.ambient{position:absolute;inset:-10%;background:radial-gradient(48% 34% at 18% 15%,rgba(255,255,255,.58),transparent 74%),radial-gradient(40% 32% at 85% 78%,rgba(205,151,79,.14),transparent 76%),linear-gradient(145deg,#F8F3ED 0%,#F5E9DA 53%,#EED9C4 100%);opacity:0;transform:scale(1.02);transition:opacity 1.7s ease,transform 2.4s var(--ease)}\n.ambient.show{opacity:1;transform:scale(1)}\n.ambient::before,.ambient::after{content:\"\";position:absolute;border-radius:50%;filter:blur(22px)}\n.ambient::before{width:60vw;max-width:430px;aspect-ratio:1/1;left:-8vw;top:12vh;background:radial-gradient(circle,rgba(255,255,255,.30),rgba(255,255,255,.02) 64%,transparent 76%);animation:lightDriftA 18s ease-in-out infinite alternate}\n.ambient::after{width:54vw;max-width:380px;aspect-ratio:1/1;right:-10vw;bottom:10vh;background:radial-gradient(circle,rgba(205,151,79,.15),rgba(205,151,79,.025) 62%,transparent 75%);animation:lightDriftB 20s ease-in-out infinite alternate}\n@keyframes lightDriftA{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(4vw,-2vh,0) scale(1.07)}}\n@keyframes lightDriftB{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(-4vw,2vh,0) scale(1.08)}}\n.paper-wrap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:22px 14px;opacity:0;transfor ize:clamp(20px,5vw,27px);line-height:1.62;font-weight:400;letter-spacing:-.014em;color:#3A312B;opacity:0;transform:translateY(4px);transition:opacity 1.8s ease,transform 1.8s var(--ease)}\n.para.show{opacity:1;transform:translateY(0)}\n.gold{color:var(--gold);font-weight:500;text-shadow:0 1px 14px rgba(184,138,52,.08)}\n.future-light,.umrah-warmth{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 1.3s ease;z-index:1}\n.future-light{background:radial-gradient(48% 36% at 50% 20%,rgba(255,255,255,.18),transparent 72%)}\n.umrah-warmth{background:radial-gradient(46% 34% at 50% 60%,rgba(211,164,92,.10),transparent 74%)}\n.future-light.show,.umrah-warmth.show{opacity:1}\n.end-card{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;text-align:center;opacity:0;pointer-events:none;background:linear-gradient(180deg,rgba(247,240,231,.93),rgba(243,228,209,.95));transition:opacity 1.5s ease}\n.end-card.show{opacity:1}\n.end-small{margin:0 0 18px;font-family:\"Dancing Script\",\"Segoe Script\",cursive;font-size:clamp(26px,7vw,36px);color:var(--muted)}\n.end-main{margin:0;font-family:\"Cormorant Garamond\",Georgia,serif;font-size:clamp(38px,10vw,58px);line-height:1.2;font-style:italic;color:var(--gold);text-shadow:0 1px 24px rgba(184,138,52,.12);transform:scale(.985);transition:transform 1.5s var(--ease)}\n.end-card.show .end-main{transform:scale(1)}\n@media(max-width:560px){\n  .paper-wrap{padding:14px 10px}\n  .paper{width:100%;height:94svh;border-radius:16px;background:linear-gradient(90deg,rgba(184,138,52,.10) 0 1px,transparent 1px 100%) 34px 0/1px 100% no-repeat,linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.08)),var(--paper)}\n  .letter-scroll{padding:48px 22px 80px 50px}\n  .para{font-size:clamp(19px,5.5vw,24px);line-height:1.58;margin-bottom:22px}\n}\n@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}\n\n.read-hint{\n  position:absolute;\n  z-index:4;\n  left:50%;\n  bottom:24px;\n  transform:translateX(-50%);\n  font-family:\"Dancing Script\",\"Segoe Script\",cursive;\n  font-size:18px;\n  color:rgba(116,103,95,.72);\n  pointer-events:none;\n  opacity:0;\n  animation:hintInOut 6s ease 2.5s forwards;\n}\n@keyframes hintInOut{\n  0%{opacity:0;transform:translate(-50%,6px)}\n  18%,68%{opacity:1;transform:translate(-50%,0)}\n  100%{opacity:0;transform:translate(-50%,0)}\n}\n\n\n/* Scene 4 refinement */\n.para.show{opacity:1;transform:translateY(0)}\n\n.para.major-space{\n  margin-top:48px;\n}\n\n.para.dua-space{\n  margin-top:58px;\n}\n\n.gold{\n  position:relative;\n}\n\n.gold.breathe{\n  animation:goldBreathe 2.2s ease 1 both;\n}\n\n@keyframes goldBreathe{\n  0%{\n    color:var(--gold);\n    text-shadow:0 1px 14px rgba(184,138,52,.08);\n  }\n  42%{\n    color:#C79B45;\n    text-shadow:0 1px 24px rgba(184,138,52,.20);\n  }\n  100%{\n    color:var(--gold);\n    text-shadow:0 1px 14px rgba(184,138,52,.08);\n  }\n}\n\n.ambient.future-mode{\n  filter:brightness(1.025);\n}\n\n.ambient.umrah-mode::after{\n  opacity:.82;\n}\n\n.ambient.solemn-mode::before,\n.ambient.solemn-mode::after{\n  animation-play-state:paused;\n}\n\n.paper.solemn-mode::after{\n  animation-play-state:paused;\n  opacity:.55;\n}\n\n.closing-emphasis{\n  position:relative;\n  margin:64px 0 28px;\n  padding:48px 10px 58px;\n  text-align:center;\n  opacity:0;\n  transform:translateY(4px);\n  transition:opacity 2s ease,transform 2s var(--ease);\n}\n\n.closing-emphasis.show{\n  opacity:1;\n  transform:translateY(0);\n}\n\n.closing-emphasis::before{\n  content:\"\";\n  position:absolute;\n  left:50%;\n  top:0;\n  width:70px;\n  height:1px;\n  transform:translateX(-50%) scaleX(.35);\n  transform-origin:center;\n  background:linear-gradient(90deg,transparent,var(--gold),transparent);\n  opacity:.48;\n  transition:transform 2.2s var(--ease),opacity 2.2s ease;\n}\n\n.closing-emphasis.show::before{\n  transform:translateX(-50%) scaleX(1);\n  opacity:.72;\n}\n\n.closing-small{\n  margin:0 0 16px;\n  font-family:\"Dancing Script\",\"Segoe Script\",cursive;\n  font-size:clamp(25px,6.5vw,34px);\n  color:rgba(116,103,95,.86);\n}\n\n.closing-main{\n  margin:0;\n  font-family:\"Cormorant Garamond\",Georgia,serif;\n  font-size:clamp(36px,9vw,54px);\n  line-height:1.16;\n  font-style:italic;\n  font-weight:500;\n  color:var(--gold);\n  text-shadow:0 1px 22px rgba(184,138,52,.12);\n}\n\n.letter-scroll.end-soften .para:not(#p8),\n.letter-scroll.end-soften .salutation{\n  opacity:.74;\n  transition:opacity 2.2s ease;\n}\n\n@media(max-width:560px){\n  .para.major-space{margin-top:38px}\n  .para.dua-space{margin-top:46px}\n  .closing-emphasis{\n    margin-top:52px;\n    padding:40px 4px 48px;\n  }\n}\n\n\n.closing-handwritten{\n  font-family:\"Dancing Script\",\"Segoe Script\",cursive;\n  font-style:normal;\n  font-weight:600;\n  font-size:clamp(38px,10vw,60px);\n  line-height:1.28;\n  letter-spacing:.01em;\n}\n.closing-handwritten span{\n  display:inline-block;\n  margin-top:10px;\n  color:var(--gold);\n}\n\n\n:host{display:block;width:100%;height:100%;overflow:hidden;background:#0B0A09;font-family:\"DM Sans\",system-ui,sans-serif;color:#2A2520;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}.scene{height:100dvh}\n@media(max-width:600px){\n  .letter-scroll{\n    -webkit-overflow-scrolling:touch;\n    overscroll-behavior-y:contain;\n  }\n  .ambient::before,.ambient::after,.paper::after{\n    animation:none!important;\n  }\n  .ambient::before,.ambient::after{filter:blur(12px)}\n  .paper::after{filter:blur(14px);opacity:.62}\n  .paper{box-shadow:0 18px 46px rgba(35,24,15,.12),0 1px 0 rgba(255,255,255,.5) inset}\n}\n</style>\n<main class=\"scene\" id=\"scene4\">\n<div class=\"blackhold\" id=\"blackhold\"></div>\n<div class=\"ambient\" id=\"ambient\"></div>\n<section class=\"paper-wrap\" id=\"paperWrap\">\n<div class=\"paper\" id=\"paper\">\n<div class=\"future-light\" id=\"futureLight\"></div>\n<div class=\"umrah-warmth\" id=\"umrahWarmth\"></div>\n<div class=\"letter-scroll\" id=\"letterScroll\">\n<p class=\"salutation\" id=\"salutation\">Shiyu,</p>\n<p class=\"para\" id=\"p1\">\n          After everything you just saw, I hope there’s one thing you take from it:\n          <span class=\"gold\">you are so much more capable than you sometimes realise.</span>\n          Not because I’m trying to motivate you for the sake of it, but because you’ve already proved it in little ways. You’ve already given your parents moments where they looked at you with that kind of pride, and honestly, I don’t think this is even remotely close to the best of what’s waiting for you.\n        </p>\n<p class=\"para\" id=\"p2\">\n          You have this whole beautiful life ahead of you, dude. One day, InshaAllah, studying abroad won’t just be something you talk about. You’ll actually be there. Somewhere far from home, surrounded by books, assignments, probably your Americano or cappuccino and definitely some pasta 😭, and I hope one random evening you stop, look around and realise that the life you once casually dreamed about actually became your life. I hope you travel, see Italy, build that ridiculous personal library, get your golden retrievers, create things you’re proud of and become genuinely independent. And I hope you never stop dreaming big just because one part of the journey becomes difficult.\n        </p>\n<p class=\"para major-space\" id=\"p3\">\n          And there’s one dream I genuinely hope Allah gives you someday:\n          <span class=\"gold\">taking your parents for Umrah, InshaAllah.</span>\n          Just imagine that. The same people who raised you, prayed for you, worried about you and became so happy over every little victory of yours, standing there with you because their daughter grew up and was able to do something beautiful for them. I really hope Allah gives you that moment. <span class=\"gold\">Your parents are already so proud of you now, Shiyu,</span> and I’m sure you’re going to give them so many more reasons to be proud of you as life goes on.\n        </p>\n<p class=\"para\" id=\"p4\">\n          Obviously everything won’t always work out exactly the way you planned. There’ll be rejections, bad days, changed plans and those moments where your dramatic potato brain decides your entire future is finished 😭. But please never let one difficult phase make you forget who you are. A bad result doesn’t make you incapable. A rejection doesn’t make your dream unrealistic. Sometimes you rest, sometimes you change the route, sometimes you start again. But you keep going.\n        </p>\n<p class=\"para\" id=\"p5\">\n          I genuinely believe there’s a version of you somewhere in the future who has already lived through so many of the things you’re currently dreaming about. And I hope when she looks back at the Shiya of today, the one who was still figuring things out, still doubting herself sometimes, still dreaming ridiculously big, she’s incredibly proud of her.\n        </p>\n<p class=\"para dua-space\" id=\"p6\">\n          May Allah open the right doors for you, protect you from the ones that aren’t meant for you, give your parents long and healthy lives to see you become everything you’re capable of becoming, and turn the beautiful little duas you carry inside you into realities even better than you imagined.\n        </p>\n<p class=\"para\" id=\"p7\">\n          And one day, InshaAllah, I hope you look around at your life and quietly think:\n          <span class=\"gold\">“Alhamdulillah… I actually made it.”</span>\n</p>\n<div class=\"closing-emphasis\" id=\"closingEmphasis\">\n<p class=\"closing-main closing-handwritten\">Keep going, Bud. 🤍<br/><span>This is only the beginning.</span></p>\n</div>\n</div>\n<div class=\"read-hint\">take your time.</div>\n</div>\n\n</section>\n</main>\n\n";

/* motivation stays restrained; no extra spotlight */\n.future-section::after{display:none!important}\n.future-section.inview{box-shadow:none}\n/* ending becomes still */\n:host(.ending-still) .motion-light,\n:host(.ending-still) .motion-glow{opacity:.06}\n@media(max-width:560px){\n  .letter{width:min(88vw,560px)}\n  .para{font-size:19px;line-height:1.72;margin-bottom:25px}\n  .trust,.question-block,.soft-section,.gratitude-section,.future-section,.apology{\n    margin-top:56px;\n    margin-bottom:56px;\n  }\n}\n\n\n@media(max-width:600px){\n  .motion-light,.motion-glow{display:none!important}\n  .page::before,.page::after{position:absolute!important}\n  .para,.emphasis,.handnote,.quote-pair,.apology,.thanks-stack,.take-time{\n    filter:none!important;\n  }\n}\n</style><main class=\"page\"><div class=\"motion-light\" aria-hidden=\"true\"></div><div class=\"motion-glow\" aria-hidden=\"true\"></div><article class=\"letter\">\n<h1 class=\"salutation\" id=\"salutation\">Shiyu,</h1>\n\n<p class=\"para\">I’ve had some time to think about our conversation properly, and the more I thought about it, the more I realised that my biggest mistake was not simply what I said. It was what I failed to notice before I said it.</p>\n\n<p class=\"para\">I was so focused on the things that felt different that I overlooked the way you had actually treated me all along.</p>\n\n<p class=\"para\">I know you well enough to know that when life becomes overwhelming, your instinct is often to withdraw, deal with things quietly, and figure them out for yourself. You have always been fiercely independent that way. You do not naturally depend on people, and you do not easily allow others to step in and help.</p>\n\n<div class=\"trust\"><p class=\"emphasis\">And yet, with me, you did.</p><p class=\"trust-sub\">That was never something I should have taken lightly.</p></div>\n\n<p class=\"para\">You allowed me to help you with things you could very easily have insisted on doing alone. You trusted me with your projects, your doubts, your plans, your random questions, and all those conversations that somehow began with work and ended somewhere completely unrelated.</p>\n\n<p class=\"emphasis gold trust-word\">It was trust.</p>\n\n<p class=\"para\">And trust from someone as independent as you is a privilege, not an entitlement.</p>\n\n<p class=\"para\">The same is true of the way you treated me emotionally.</p>\n\n<p class=\"para\">You have told me yourself that there are times when you disappear from people, go quiet, or simply do not have the energy to explain yourself. Yet knowing the kind of person I am, knowing how easily I can overthink things, you often made an effort to explain yourself to me.</p>\n\n<p class=\"para\">You made sure I understood when something was not about me.</p>\n<p class=\"para\">You reassured me in ways you did not necessarily owe me.</p>\n\n<p class=\"para\">Even when you were quieter, you still listened to my stories, reacted to the things I sent you, spoke to me, and remained present in small ways that I had grown so accustomed to that I stopped recognising their value.</p>\n\n<p class=\"emphasis\">You had actually treated me very well.</p>\n\n<p class=\"para\">And instead of appreciating that, I allowed myself to become preoccupied with the few things I felt were missing.</p>\n\n<p class=\"para\">I compared replies, conversations, snaps, attention and energy as though friendship could somehow be measured that way.</p>\n\n<p class=\"para\">It cannot.</p>\n\n<p class=\"para\">You never owed me equal replies. You never owed me equal access to your time. You never owed me explanations simply because I was close to you.</p>\n\n<p class=\"para\">Most importantly, you never owed me a particular version of yourself just so that I could feel secure.</p>\n\n<p class=\"handnote\">I understand that now.</p>\n\n<p class=\"para\">There is one part of our conversation that stayed with me more than anything else. When you said you would rather handle your work yourself because you never wanted there to be a day where I could say that you were only close to me because you needed my help, it made me look at my own words differently.</p>\n\n<p class=\"para\">My first instinct could easily have been to ask, <em>“How could you ever think that of me?”</em></p>\n\n<p class=\"para\">But that would have been the easy response.</p>\n\n<div class=\"question-block\"><p class=\"lead\">The more honest question was:</p><p class=\"q\">What did I say that made you feel you needed to protect yourself from that possibility in the first place?</p></div>\n\n<p class=\"para\">I know what my intentions were. Whenever I helped you, I did it because I genuinely wanted to. I never kept score, and I never believed you owed me anything in return.</p>\n\n<p class=\"para\">But intention exists inside my head.</p>\n<p class=\"para\">You only receive my words and my actions.</p>\n\n<p class=\"para\">And if something I said made you question whether my help came with expectations attached, then I have to be mature enough to acknowledge the effect of those words rather than simply defend what I meant.</p>\n\n<div class=\"soft-section\">\n<p class=\"para\">That realisation made me look at the entire friendship differently.</p>\n<p class=\"para\">You never actually disappeared, Shiyu.</p>\n<p class=\"para\">Maybe you became quieter. Maybe your energy changed. Maybe you were dealing with things you did not want to speak about.</p>\n<p class=\"para\">But you were still there.</p>\n<p class=\"para echo\">You were there in the conversations.</p>\n<p class=\"para echo\">You were there in the little reactions.</p>\n<p class=\"para echo\">You were there in the way you listened.</p>\n<p class=\"para echo\">You were there in the way you understood how my mind works and often tried to stop me from turning something small into something much bigger.</p>\n<div class=\"quote-pair core-quote\"><p>You were there.</p><p>I simply stopped seeing it properly.</p></div>\n<p class=\"para\">And that is something I genuinely regret.</p>\n<p class=\"para\">Because the truth is, you never failed me as a friend.</p>\n<p class=\"emphasis\">I failed to appreciate the friendship in front of me because I was too busy comparing it.</p>\n</div>\n\n<div class=\"gratitude-section\">\n<p class=\"para\">So before I say anything else, I want to thank you.</p>\n<p class=\"para\">Thank you for trusting me.</p>\n<p class=\"para\">Thank you for allowing me to help you, especially when I know accepting help does not come naturally to you.</p>\n<p class=\"para\">Thank you for the patience you showed me, for the explanations you gave me when you could easily have remained silent, and for all the small ways you made space for me in your life.</p>\n<p class=\"para\">I should have appreciated those things more while they were happening rather than understanding their value only after something went wrong.</p>\n</div>\n\n<p class=\"para\">And I do not want this letter to become another expectation placed on you.</p>\n\n<p class=\"para\">You do not need to explain what you are going through. You do not need to become more talkative. You do not need to return to some previous version of yourself. You do not need to restart anything simply because I have finally understood my mistake.</p>\n\n<p class=\"para\">Be exactly who you need to be right now.</p>\n\n<p class=\"para\">Take your time. Handle things in the way that feels right to you. Ask for help when you want it, and choose to do things yourself when that is what gives you peace.</p>\n\n<div class=\"future-section\">\n<p class=\"para\">But through all of it, I hope you never lose sight of the person you are.</p>\n<p class=\"para\">I still hope life gives you all those enormous dreams you carry with you, InshaAllah.</p>\n<p class=\"para\">I hope the difficult phase you are in now becomes one small chapter you eventually look back on and realise you were far stronger than you felt at the time.</p>\n<p class=\"para\">Most of all, I hope you never allow one misunderstanding, one difficult season, or one person’s inability to understand you properly to make you question your worth.</p>\n<p class=\"para\">You deserve better than that.</p>\n</div>\n\n<p class=\"para\">And from my side, there is one thing I want to make very clear.</p>\n<p class=\"para\">I do not want to remember this friendship only through the one conversation where I misunderstood you.</p>\n<p class=\"para\">I would rather remember everything I should have valued before that.</p>\n\n<div class=\"quote-pair\"><p>You were there.</p><p>You treated me with more consideration than I gave you credit for.</p><p>You trusted me.</p></div>\n\n<p class=\"para\">And I should have respected that trust more carefully.</p>\n\n<p class=\"para\">I am not writing this expecting forgiveness, reassurance or an immediate return to normal.</p>\n\n<p class=\"para\">I simply wanted to acknowledge my mistake properly and thank you properly.</p>\n\n<div class=\"apology\">\n<p class=\"sorry\">I am sorry, Shiyu.</p>\n<p class=\"more-important\">And perhaps even more importantly,</p>\n<p class=\"thank-you\">thank you.</p>\n</div>\n\n<div class=\"thanks-stack\"><p>For the friendship.</p><p>For the trust.</p><p>For the patience.</p><p>And for all the small things I should have appreciated sooner.</p></div>\n\n<p class=\"take-time\">take your time.</p>\n<div class=\"end-space\"></div>\n</article></main>";

      b.setAttribute('aria-label',`Go to photo ${i+1}`);
      b.addEventListener('click',()=>{
        const left=card.offsetLeft-(track.clientWidth-card.clientWidth)/2;
        track.scrollTo({left:Math.max(0,left),behavior:reduced?'auto':'smooth'});
      });
      progress?.appendChild(b);
    });
    const dots=[...(progress?.querySelectorAll('.dot')||[])];

    let activeIndex=0,raf=null,seventhHoldToken=0,endingStarted=false;
    const clearSeventhHold=()=>{ seventhHoldToken++; };
    const startSeventhHold=()=>{
      if(endingStarted) return;
      const token=++seventhHoldToken;
      (async()=>{
        await wait(650);
        if(token===seventhHoldToken && activeIndex===6 && !endingStarted){
          playEnding();
        }
      })();
    };
    const updateActive=()=>{
      if(!track || !cards.length) return;
      const center=track.getBoundingClientRect().left+track.clientWidth/2;
      let best=0,bestDist=Infinity;
      cards.forEach((card,i)=>{
        const r=card.getBoundingClientRect();
        const d=Math.abs((r.left+r.width/2)-center);
        if(d<bestDist){bestDist=d;best=i}
      });
      if(best!==activeIndex){
        activeIndex=best;
        cards.forEach((c,i)=>c.classList.toggle('active',i===best));
        dots.forEach((d,i)=>d.classList.toggle('active',i===best));
        if(counter) counter.textContent=String(best+1).padStart(2,'0')+' / '+String(cards.length).padStart(2,'0');
      }
      if(activeIndex===6 && !endingStarted) startSeventhHold(); else clearSeventhHold();
    };

    async function playEnding(){
      if(endingStarted) return;
      endingStarted=true;

      // Once the seventh memory has genuinely settled, keep it there.
      // This prevents an accidental swipe during the 3-second hold from
      // making the ending play over a different photo.
      if(track && cards[6]){
        const left=cards[6].offsetLeft-(track.clientWidth-cards[6].clientWidth)/2;
        track.scrollTo({left:Math.max(0,left),behavior:'auto'});
        track.style.pointerEvents='none';
        track.style.overflowX='hidden';
      }
      if(progress) progress.style.pointerEvents='none';
      activeIndex=6;
      cards.forEach((c,i)=>c.classList.toggle('active',i===6));
      dots.forEach((d,i)=>d.classList.toggle('active',i===6));
      if(counter) counter.textContent='07 / 07';

      lastCard?.classList.add('final-focus');
      await wait(3000);
      lastPhoto?.classList.add('fade-soft');
      await wait(650);
      endOverlay?.classList.add('show');
      endOverlay?.setAttribute('aria-hidden','false');
      await wait(450); endOverlay?.classList.add('stage-1');
      await wait(1200); endOverlay?.classList.add('stage-2');
      await wait(1400); endOverlay?.classList.add('stage-3');
      await wait(1600); endOverlay?.classList.add('stage-4');
      await wait(3000); endOverlay?.classList.add('message-fade');
      await wait(1900); endOverlay?.classList.add('handwriting-phase'); handwritten?.classList.add('show'); handwritten?.setAttribute('aria-hidden','false');
      await wait(600); handwritten?.classList.add('write-1');
      await wait(2300); handwritten?.classList.add('write-2');
      await wait(2350); handwritten?.classList.add('write-3');
      await wait(3600); handwritten?.classList.add('write-4');
      await wait(4700); handwritten?.classList.add('focus-last'); endOverlay?.classList.add('final-atmosphere');
      await wait(2600); handwritten?.classList.add('write-5');
      await wait(4700); handwritten?.classList.add('final-settle');
      await wait(3800); startScene6Bridge();
    }

    async function startScene6Bridge(){
      scene?.classList.add('cooler');
      endOverlay?.classList.add('bridge-six');
      handwritten?.classList.add('bridge-away');
      lastPhoto?.classList.add('fade-deeper');
      await wait(2200);
      scene6?.classList.add('show');
      await wait(300); six1?.classList.add('show');
      await wait(2600); six2?.classList.add('show');
      await wait(3500); six1?.classList.add('fade-soft'); six2?.classList.add('fade-soft');
      await wait(1500); six3?.classList.add('show');
      await wait(2200); six4?.classList.add('show');
      await wait(900); sixBreath?.classList.add('show');
      await wait(3300);
      transition56to7();
    }

    let settleTimer=null;
    track?.addEventListener('scroll',()=>{
      cancelAnimationFrame(raf);
      raf=requestAnimationFrame(updateActive);

      clearTimeout(settleTimer);
      settleTimer=setTimeout(()=>{
        updateActive();
      }, TEST?20:160);
    },{passive:true});
    updateActive();

    (async()=>{
      await wait(900); kicker?.classList.add('show');
      await wait(2500); introLine?.classList.add('show');
      await wait(3300); intro?.classList.add('hide');
      await wait(650); gallery?.classList.add('show');
      await wait(650); galleryNote?.classList.add('show');
      await wait(3500); galleryNote?.classList.remove('show');
    })();
  }

  async function transition56to7(){
    if(scene56Leaving) return;
    scene56Leaving=true;
    mount7();
    await nextFrame();
    host7.classList.add('visible');
    // Start Scene 7 under the tail of Scene 6 so there is no visible cut.
    if(!scene7Started){scene7Started=true;runScene7()}
    await wait(500);
    host56.classList.add('fade-out');
    await wait(1700);
    host56.classList.add('gone');
    clearRoot(root56);
  }

  async function reveal7(id) {
    const el=q7(id);
    if(el) el.classList.add('show');
  }
  async function switch7(fromId,toId) {
    const from=q7(fromId), to=q7(toId);
    if(!from || !to) return;
    from.classList.add('leaving');
    await wait(1300);
    from.classList.remove('active','leaving');
    to.classList.add('active');
    await wait(450);
  }

  let scene8Started=false;
  async function transitionToLetter() {
    await wait(3600);
    mount8();
    await nextFrame();
    host8.classList.add('visible');
    host7.classList.add('fade-out');
    await wait(1500);
    host7.classList.add('gone');
    clearRoot(root7);
    document.body.style.overflow='auto';
    document.body.style.overscrollBehaviorY='auto';
    window.scrollTo({top:0,left:0,behavior:'auto'});
    initScene8();
  }

  async function runScene7() {
    await wait(900);
    await reveal7('opening');
    await wait(2800);
    await reveal7('admission');
    await wait(3000);

    // The comparison thoughts move a little faster, like thoughts stacking.
    await reveal7('t1'); await wait(780);
    await reveal7('t2'); await wait(780);
    await reveal7('t3'); await wait(780);
    await reveal7('t4');
    await wait(1900);

    ['t1','t2','t3','t4'].forEach(id => q7(id)?.classList.add('out'));
    q7('opening')?.classList.add('fade');
    q7('admission')?.classList.add('fade');
    q7('scene')?.classList.add('deeper');
    await wait(1150);
    await switch7('block1','block2');

    await reveal7('turn'); await wait(2200);
    await reveal7('questionLead'); await wait(2100);

    // Everything settles before the one question that mattered.
    q7('scene')?.classList.add('question-still');
    await wait(1050);
    await reveal7('question');
    await wait(4700);

    await reveal7('should');
    await wait(3000);
    q7('scene')?.classList.remove('question-still');

    ['turn','questionLead','question','should'].forEach(id => q7(id)?.classList.add('fade'));
    await wait(1050);
    await switch7('block2','block3');

    // Accountability is clear but does not linger longer than the central question.
    await reveal7('o1'); await wait(900);
    await reveal7('o2'); await wait(900);
    await reveal7('o3'); await wait(900);
    await reveal7('o4'); await wait(1900);

    ['o1','o2','o3','o4'].forEach(id => q7(id)?.classList.add('fade'));
    await wait(1050);
    await reveal7('realisation'); await wait(3150);
    await reveal7('guilt'); await wait(3500);
    await reveal7('seeNow'); await wait(2350);
    await reveal7('more');
    transitionToLetter();
  }

  let finalTimer=null;
  let finalStarted=false;
  let scene8Cleanup=()=>{};

  function initScene8() {
    if(scene8Started) return;
    scene8Started=true;

    const salutation = root8.getElementById('salutation');
    setTimeout(() => salutation?.classList.add('show'), TEST ? 30 : 500);

    const revealEls=[...root8.querySelectorAll('.para,.emphasis,.question-block,.handnote,.quote-pair,.apology,.thanks-stack,.take-time')];
    const revealObserver=new IntersectionObserver(entries => {
      entries.forEach(entry => {
        if(entry.isIntersecting){
          entry.target.classList.add('reveal');
          revealObserver.unobserve(entry.target);
        }
      });
    },{threshold:.13,rootMargin:'0px 0px -7% 0px'});
    revealEls.forEach(el => revealObserver.observe(el));

    const momentEls=[...root8.querySelectorAll('.trust,.soft-section,.gratitude-section')];
    const momentObserver=new IntersectionObserver(entries => {
      entries.forEach(entry => entry.target.classList.toggle('inview',entry.isIntersecting));
    },{threshold:.22,rootMargin:'-8% 0px -15% 0px'});
    momentEls.forEach(el => momentObserver.observe(el));

    let ticking=false;
    const updateAmbient=()=>{
      const y=scrollY || document.documentElement.scrollTop || 0;
      const max=Math.max(1,document.documentElement.scrollHeight-innerHeight);
      const p=Math.min(1,Math.max(0,y/max));
      host8.style.setProperty('--ambientY',`${Math.round(p*44)}px`);
      host8.style.setProperty('--ambientX',`${Math.round(Math.sin(p*Math.PI)*12)}px`);
      ticking=false;
    };
    const onScroll=()=>{
      if(!ticking && !reduced){
        requestAnimationFrame(updateAmbient);
        ticking=true;
      }
    };
    addEventListener('scroll',onScroll,{passive:true});
    updateAmbient();

    let endingObserver=null;
    const apology=root8.querySelector('.apology');
    if(apology){
      endingObserver=new IntersectionObserver(entries=>{
        if(entries.some(e=>e.isIntersecting)){
          host8.classList.add('ending-still');
          endingObserver.disconnect();
        }
      },{threshold:.25});
      endingObserver.observe(apology);
    }

    const finishLine=root8.querySelector('.take-time');
    if(finishLine){
      let endCheckRaf=0;
      let finalObserver=null;
      let endScrollHandler=null;

      const armFinal=()=>{
        if(finalStarted || finalTimer) return;

        // One-shot visible-time hold. It will not skip ahead if the app
        // is backgrounded during these three seconds.
        const ticket={cancelled:false};
        finalTimer=ticket;

        try{ finalObserver?.disconnect(); }catch{}
        if(endScrollHandler) removeEventListener('scroll',endScrollHandler);

        (async()=>{
          await wait(TEST?80:3000);
          if(finalTimer===ticket && !ticket.cancelled && !finalStarted){
            finalTimer=null;
            startFinal();
          }
        })();
      };

      finalObserver=new IntersectionObserver(entries=>{
        entries.forEach(entry=>{
          if(entry.isIntersecting && entry.intersectionRatio >= .55){
            armFinal();
          }
        });
      },{threshold:[.35,.55,.8]});
      finalObserver.observe(finishLine);

      const checkActualEnd=()=>{
        endCheckRaf=0;
        if(finalStarted || finalTimer) return;
        const doc=document.documentElement;
        const nearBottom=(scrollY + innerHeight) >= (doc.scrollHeight - 18);
        if(nearBottom) armFinal();
      };

      endScrollHandler=()=>{
        if(!endCheckRaf) endCheckRaf=requestAnimationFrame(checkActualEnd);
      };
      addEventListener('scroll',endScrollHandler,{passive:true});
      checkActualEnd();

      scene8Cleanup=()=>{
        try{ revealObserver.disconnect(); }catch{}
        try{ momentObserver.disconnect(); }catch{}
        try{ endingObserver?.disconnect?.(); }catch{}
        try{ finalObserver?.disconnect(); }catch{}
        try{ removeEventListener('scroll',onScroll); }catch{}
        try{ if(endScrollHandler) removeEventListener('scroll',endScrollHandler); }catch{}
        if(endCheckRaf) cancelAnimationFrame(endCheckRaf);
        if(finalTimer && typeof finalTimer==='object') finalTimer.cancelled=true;
        finalTimer=null;
      };
    } else {
      scene8Cleanup=()=>{
        try{ revealObserver.disconnect(); }catch{}
        try{ momentObserver.disconnect(); }catch{}
        try{ endingObserver?.disconnect?.(); }catch{}
        try{ removeEventListener('scroll',onScroll); }catch{}
      };
    }
  }

  async function startFinal() {
    if(finalStarted) return;
    finalStarted=true;

    // "take your time." has already stayed on screen for ~3 seconds.
    // Now move straight into the ending with no dead blank section.
    dissolve?.classList.add('active','warming');
    host8.classList.add('letter-fading');

    await wait(700);
    dissolve?.classList.add('blackout');

    await wait(650);
    mountF();
    await nextFrame();
    hostF.classList.add('visible');

    document.documentElement.classList.add('locked');
    document.body.classList.add('locked');
    host8.classList.add('letter-gone');
    try{ scene8Cleanup(); }catch{}
    clearRoot(root8);

    await wait(260);
    dissolve?.classList.remove('active','warming','blackout');

    // The ending begins almost immediately after the dissolve completes.
    await wait(320);
    runFinal();
  }

  async function revealF(id,ms=0) {
    if(ms) await wait(ms);
    qF(id)?.classList.add('show');
  }

  async function switchF(fromId,toId) {
    const from=qF(fromId),to=qF(toId);
    if(!from || !to) return;
    from.classList.add('leaving');
    await wait(1500);
    from.classList.remove('active','leaving');
    to.classList.add('active');
    await wait(350);
  }

  async function runFinal() {
    const finalScene=qF('scene');

    await wait(420);
    await revealF('l1');
    await wait(3900);

    await switchF('b1','b2');
    await revealF('l2'); await wait(1900);
    // Hero moment 1: the heart line.
    await revealF('l3'); await wait(4800);

    await switchF('b2','b3');
    await revealF('l4'); await wait(2100);
    await revealF('l5'); await wait(4000);

    await switchF('b3','b4');
    finalScene?.classList.add('deep');
    await revealF('l6'); await wait(1800);
    await revealF('l7'); await wait(2200);
    // Hero moment 2: let "You were there." arrive and then become completely still.
    await revealF('l8'); await wait(3900);
    await revealF('l9'); await wait(3900);

    await switchF('b4','b5');
    await revealF('l10'); await wait(1050);
    await revealF('l11'); await wait(1050);
    await revealF('l12'); await wait(1800);
    await revealF('l13'); await wait(4200);

    await switchF('b5','b6');
    await revealF('l14'); await wait(1900);
    await revealF('l15'); await wait(4200);

    await switchF('b6','b7');
    // These belong to one thought, so they arrive together instead of as three title cards.
    await Promise.all([revealF('l16'),revealF('l17'),revealF('l18')]);
    await wait(3900);
    await Promise.all([revealF('l19'),revealF('l20')]);
    await wait(4200);

    await switchF('b7','b8');
    // The future thought also arrives as one quiet passage.
    await Promise.all([revealF('l21'),revealF('l22'),revealF('l23')]);
    await wait(4100);
    await revealF('l24');
    await wait(4600);

    qF('b8')?.classList.add('leaving');
    await wait(1900);
    qF('b8')?.classList.remove('active','leaving');

    const final=qF('final');
    final?.classList.add('show');
    await wait(1200);
    // Hero moment 3: the last handwritten line writes itself.
    final?.classList.add('madam-in');
    await wait(5000);
    // The goodbye is whispered in, not typed.
    final?.classList.add('fi-in');
    await wait(4400);
    final?.classList.add('settle');
  }

  /* ---------------- V3 viewer controls ---------------- */
  const controlBar = document.getElementById('cinemaControls');
  const pauseButton = document.getElementById('cinemaPause');
  const restartButton = document.getElementById('cinemaRestart');
  let controlsTimer = 0;

  const showControls = () => {
    if(!controlBar) return;
    controlBar.classList.add('visible');
    clearTimeout(controlsTimer);
    controlsTimer = setTimeout(() => controlBar.classList.remove('visible'), 3600);
  };

  const setPaused = next => {
    userPaused = next;
    document.dispatchEvent(new Event('cinema-pause'));
    if(pauseButton){
      pauseButton.textContent = userPaused ? 'Play' : 'Pause';
      pauseButton.setAttribute('aria-label', userPaused ? 'Resume experience' : 'Pause experience');
    }
    showControls();
  };

  pauseButton?.addEventListener('click', () => setPaused(!userPaused));
  restartButton?.addEventListener('click', () => {
    restartButton.blur();
    location.reload();
  });

  ['pointermove','touchstart','keydown'].forEach(type => {
    document.addEventListener(type, event => {
      if(type === 'keydown' && event.key !== 'Escape' && event.key !== ' ') return;
      showControls();
    }, {passive:type !== 'keydown'});
  });

  document.addEventListener('keydown', event => {
    if(event.key !== ' ' || event.target?.matches?.('input,textarea,button')) return;
    event.preventDefault();
    setPaused(!userPaused);
  });

  // The controls stay discoverable without competing with the experience.
  setTimeout(showControls, reduced ? 400 : 4200);

  initScene123().catch(err => console.error(err));
})();
</script>
